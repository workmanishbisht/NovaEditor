<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="../assets/images/favicon/favicon.png">
    <title>Projects - Nova Editor</title>

    <!-- RemixIcon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" />
    <!-- Css file link -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/projects.css" />
    <link rel="stylesheet" href="../css/projectmodal.css" />
    <link rel="stylesheet" href="../css/toast.css">
</head>

<body data-page="projects">
    <div class="app-shell">

        <!-- Sidebar mounts here (existing component, reused as-is) -->
        <div id="sidebarMount"></div>

        <div class="app-main">

            <!-- Header mounts here (existing component, reused as-is) -->
            <div id="headerMount"></div>

            <main class="projects-page" id="projectsContent">

                <!-- =======================================
                Page Header
                ======================================= -->
                <section class="proj-hero">
                    <div class="proj-hero-text">
                        <h1>Projects</h1>
                        <p>All your coding projects in one place. Create, manage and organize your projects.</p>
                    </div>
                    <div class="proj-hero-actions">
                        <button type="button" class="btn btn-outline" id="projectsImportBtn" data-import-project>
                            <i class="ri-upload-2-line"></i>
                            Import Project
                        </button>
                        <button type="button" class="btn btn-primary" id="projectsNewBtn" data-new-project>
                            <i class="ri-add-line"></i>
                            New Project
                        </button>
                    </div>
                </section>

                <!-- =======================================
                Search
                ======================================= -->
                <div class="proj-search">
                    <i class="ri-search-line"></i>
                    <input type="text" id="projectsSearchInput" placeholder="Search projects...">
                    <span class="search-kbd" aria-hidden="true"><kbd>Ctrl</kbd><kbd>K</kbd></span>
                </div>

                <!-- =======================================
                Toolbar: Filter Tabs + Sort/View
                ======================================= -->
                <div class="proj-toolbar">

                    <div class="proj-tabs-scroll">
                        <div class="proj-tabs" role="tablist" aria-label="Project filters" id="projectsTabs">
                            <button type="button" class="proj-tab is-active" role="tab" aria-selected="true">
                                <i class="ri-apps-2-line"></i>
                                All Projects
                            </button>
                            <button type="button" class="proj-tab" role="tab" aria-selected="false">
                                <i class="ri-time-line"></i>
                                Recent
                            </button>
                            <button type="button" class="proj-tab" role="tab" aria-selected="false">
                                <i class="ri-star-line"></i>
                                Starred
                            </button>
                            <button type="button" class="proj-tab" role="tab" aria-selected="false">
                                <i class="ri-share-forward-line"></i>
                                Shared with me
                            </button>
                            <button type="button" class="proj-tab" role="tab" aria-selected="false">
                                <i class="ri-delete-bin-line"></i>
                                Trash
                            </button>
                        </div>
                    </div>

                    <div class="proj-toolbar-right">
                        <button type="button" class="proj-sort" id="projectsSortBtn">
                            <span class="proj-sort-label">Sort by:</span>
                            <span class="proj-sort-value">Recently Updated</span>
                            <i class="ri-arrow-down-s-line"></i>
                        </button>

                        <div class="view-toggle" role="group" aria-label="Layout view">
                            <button type="button" class="view-toggle-btn is-active" id="projectsGridViewBtn"
                                aria-label="Grid view" aria-pressed="true">
                                <i class="ri-grid-fill"></i>
                            </button>
                            <button type="button" class="view-toggle-btn" id="projectsListViewBtn"
                                aria-label="List view" aria-pressed="false">
                                <i class="ri-list-check-2"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- =======================================
                Project Grid
                Dynamic cards are injected here by projects.js
                ======================================= -->
                <div class="proj-grid" id="projectsGrid"></div>

                <!-- =======================================
                Empty State
                Shown by JS when there are no projects
                ======================================= -->
                <section class="proj-empty-state" id="projectsEmptyState" hidden>
                    <div class="proj-empty-icon">
                        <i class="ri-folder-open-line"></i>
                    </div>
                    <h3>No projects yet?</h3>
                    <p>Create your first project and start building something amazing.</p>
                    <div class="proj-empty-actions">
                        <button type="button" class="btn btn-primary" data-new-project>
                            <i class="ri-add-line"></i>
                            New Project
                        </button>
                        <button type="button" class="btn btn-outline" data-import-project>
                            <i class="ri-upload-2-line"></i>
                            Import Project
                        </button>
                    </div>
                </section>

                <!-- =======================================
                Pagination
                ======================================= -->
                <nav class="proj-pagination" aria-label="Projects pagination" id="projectsPagination">
                    <p class="proj-pagination-info">Showing 1 to 6 of 48 projects</p>
                    <div class="proj-pagination-controls">
                        <button type="button" class="proj-page-btn" disabled aria-label="Previous page">
                            <i class="ri-arrow-left-s-line"></i>
                            <span class="proj-page-btn-label">Previous</span>
                        </button>
                        <button type="button" class="proj-page-num is-active" aria-current="page">1</button>
                        <button type="button" class="proj-page-num">2</button>
                        <button type="button" class="proj-page-num">3</button>
                        <span class="proj-page-ellipsis">…</span>
                        <button type="button" class="proj-page-num">8</button>
                        <button type="button" class="proj-page-btn" aria-label="Next page">
                            <span class="proj-page-btn-label">Next</span>
                            <i class="ri-arrow-right-s-line"></i>
                        </button>
                    </div>
                </nav>

            </main>
        </div>
    </div>

    <div id="projectModalMount"></div>

    <!-- script file  -->
    <script type="module" src="../components/toast.js"></script>
    <script type="module" src="../js/layout.js"></script>
    <script type="module" src="../js/projects.js"></script>

</body>
</html>
