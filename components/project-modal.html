<!-- ==========================================
     Project Modal
========================================== -->
<div id="projectModal" class="project-modal" hidden>

    <div class="project-modal-overlay" id="projectModalOverlay"></div>

    <div class="project-modal-container" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">

        <!-- Header -->
        <div class="project-modal-header">
            <div class="project-header-text">
                <span class="project-badge">Nova Editor</span>
                <h2 id="projectModalTitle">Create Project</h2>
                <p>Set up a new workspace-ready project.</p>
            </div>
            <button type="button" id="closeProjectModal" class="project-close-btn" aria-label="Close">
                <i class="ri-close-line"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="project-modal-body">
            <form id="projectForm" autocomplete="off">

                <div class="form-group">
                    <label for="projectName">
                        Project name
                        <span class="required">*</span>
                    </label>
                    <input type="text" id="projectName" name="projectName" maxlength="50"
                        placeholder="My Awesome Project" required>
                </div>

                <div class="form-group">
                    <label for="projectDescription">
                        Description
                        <span class="optional">Optional</span>
                    </label>
                    <textarea id="projectDescription" name="projectDescription" rows="3" maxlength="200"
                        placeholder="What is this project about?"></textarea>
                </div>

                <div class="project-grid">
                    <div class="form-group">
                        <label for="projectLanguage">
                            Language
                            <span class="required">*</span>
                        </label>
                        <select id="projectLanguage" name="projectLanguage" required>
                            <option value="html">HTML · CSS · JS</option>
                            <option value="react">React</option>
                            <option value="vue">Vue</option>
                            <option value="node">Node.js</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="projectFramework">Framework</label>
                        <select id="projectFramework" name="projectFramework">
                            <option value="none">None</option>
                            <option value="bootstrap">Bootstrap</option>
                            <option value="tailwind">Tailwind CSS</option>
                            <option value="vite">Vite</option>
                            <option value="next">Next.js</option>
                        </select>
                    </div>
                </div>

                <div class="project-grid">
                    <div class="form-group">
                        <label for="projectTemplate">Template</label>
                        <select id="projectTemplate" name="projectTemplate">
                            <option value="blank">Blank project</option>
                            <option value="landing">Landing page</option>
                            <option value="portfolio">Portfolio</option>
                            <option value="dashboard">Admin dashboard</option>
                            <option value="blog">Blog website</option>
                            <option value="ecommerce">E-commerce</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="projectWorkspace">Workspace</label>
                        <select id="projectWorkspace" name="projectWorkspace"></select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Visibility</label>
                    <div class="visibility-toggle">
                        <label class="visibility-option active">
                            <input type="radio" name="visibility" value="private" checked>
                            <span>Private</span>
                        </label>
                        <label class="visibility-option disabled">
                            <input type="radio" name="visibility" value="public" disabled>
                            <span>Public</span>
                            <small>Soon</small>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Project options</label>
                    <div class="option-list">
                        <label class="option-row">
                            <input type="checkbox" id="createReadme" checked>
                            <span class="option-text">
                                <strong>Create README.md</strong>
                                <small>Generate a README file automatically</small>
                            </span>
                        </label>
                        <label class="option-row">
                            <input type="checkbox" id="initializeGit" checked>
                            <span class="option-text">
                                <strong>Initialize Git</strong>
                                <small>Start with a Git repository</small>
                            </span>
                        </label>
                        <label class="option-row">
                            <input type="checkbox" id="createDefaultFiles" checked>
                            <span class="option-text">
                                <strong>Create starter files</strong>
                                <small>index.html, style.css, script.js</small>
                            </span>
                        </label>
                    </div>
                </div>

            </form>
        </div>

        <!-- Footer -->
        <div class="project-modal-footer">
            <button type="button" id="cancelProjectBtn" class="btn btn-outline">
                Cancel
            </button>
            <button type="submit" form="projectForm" id="createProjectBtn" class="btn btn-primary">
                <span>Create project</span>
            </button>
        </div>

    </div>
</div>
